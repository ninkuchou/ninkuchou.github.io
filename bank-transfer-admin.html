<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>人工帖｜銀行振込管理</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#0f2342;background:#f4f7fc}
    *{box-sizing:border-box}body{margin:0}.wrap{width:min(1040px,calc(100% - 28px));margin:32px auto 80px}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}h1{font-size:24px;margin:0}.back{color:#2459dc;text-decoration:none}
    .tools,.tabs{display:flex;gap:8px;flex-wrap:wrap}.panel{background:#fff;border:1px solid #dfe6f2;border-radius:16px;padding:20px;box-shadow:0 8px 28px rgba(25,56,105,.08)}
    button{font:inherit;border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}.primary{color:#fff;background:#2860e8}.secondary{color:#17315c;background:#edf2fa}.tab.active{color:#fff;background:#2860e8}
    button:disabled{opacity:.55;cursor:wait}.status{margin:16px 0;color:#526681}.error{color:#b42318}.ok{color:#067647}
    .list{display:grid;gap:14px;margin-top:18px}.card{border:1px solid #dfe6f2;border-radius:14px;padding:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.company{font-size:18px;font-weight:800}.badge{border-radius:99px;padding:5px 10px;font-size:12px;font-weight:800;background:#fff1cc;color:#7a4d00}.badge.paid{background:#dff7ea;color:#067647}
    dl{display:grid;grid-template-columns:130px 1fr;gap:7px 12px;margin:15px 0}dt{color:#63738c}dd{margin:0;overflow-wrap:anywhere}.actions{display:flex;justify-content:flex-end}.empty{text-align:center;color:#63738c;padding:42px 10px}
    @media(max-width:600px){.wrap{margin-top:20px}.panel{padding:15px}header{align-items:flex-start;flex-direction:column}dl{grid-template-columns:1fr;gap:2px}dd{margin-bottom:8px}.actions button{width:100%}}
  </style>
</head>
<body>
  <main class="wrap">
    <header><div><h1>銀行振込管理</h1><div>人工帖 運営者用</div></div><a class="back" href="/">人工帖へ戻る</a></header>
    <section class="panel">
      <div class="tools">
        <div class="tabs" aria-label="表示切替">
          <button class="tab primary active" data-status="pending">入金待ち</button>
          <button class="tab secondary" data-status="paid">入金済み</button>
          <button class="tab secondary" data-status="all">すべて</button>
        </div>
        <button id="reload" class="secondary" type="button">再読込</button>
      </div>
      <div id="status" class="status">ログイン状態を確認しています…</div>
      <div id="list" class="list"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (() => {
    "use strict";
    const SUPABASE_URL = "https://mwciytoyxgznczcqjgxs.supabase.co";
    const SUPABASE_KEY = "sb_publishable_pDUx_9hTHGM6hGyAWq9k2w_TljCPogw";
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const statusEl = document.getElementById("status");
    const listEl = document.getElementById("list");
    const reloadBtn = document.getElementById("reload");
    let selectedStatus = "pending";

    const setStatus = (message, kind = "") => {
      statusEl.textContent = message;
      statusEl.className = `status ${kind}`;
    };
    const date = (value) => value ? new Intl.DateTimeFormat("ja-JP", {
      timeZone:"Asia/Tokyo", year:"numeric", month:"2-digit", day:"2-digit",
      hour:"2-digit", minute:"2-digit"
    }).format(new Date(value)) : "—";
    const companyName = (row) => {
      const company = Array.isArray(row.companies) ? row.companies[0] : row.companies;
      return company?.name || "会社名なし";
    };

    async function callAdmin(body) {
      const { data } = await client.auth.getSession();
      const token = data?.session?.access_token;
      if (!token) throw new Error("人工帖へログインしてから、このページを開いてください。");
      const response = await fetch(`${SUPABASE_URL}/functions/v1/bank-transfer-admin`, {
        method:"POST",
        headers:{
          apikey:SUPABASE_KEY,
          Authorization:`Bearer ${token}`,
          "Content-Type":"application/json"
        },
        body:JSON.stringify(body)
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.error || `通信エラー（${response.status}）`);
      return result;
    }

    function addField(dl, label, value) {
      const dt = document.createElement("dt");
      const dd = document.createElement("dd");
      dt.textContent = label;
      dd.textContent = value;
      dl.append(dt, dd);
    }

    function render(rows) {
      listEl.replaceChildren();
      if (!rows.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = selectedStatus === "pending" ? "入金待ちの申請はありません。" : "該当する申請はありません。";
        listEl.append(empty);
        return;
      }
      rows.forEach((row) => {
        const card = document.createElement("article");
        card.className = "card";
        const top = document.createElement("div");
        top.className = "top";
        const name = document.createElement("div");
        name.className = "company";
        name.textContent = companyName(row);
        const badge = document.createElement("span");
        badge.className = `badge ${row.status === "paid" ? "paid" : ""}`;
        badge.textContent = row.status === "paid" ? "入金済み" : row.status === "pending" ? "入金待ち" : row.status;
        top.append(name, badge);

        const dl = document.createElement("dl");
        addField(dl, "受付番号", String(row.reference_code || ""));
        addField(dl, "金額", `${Number(row.amount_yen || 0).toLocaleString("ja-JP")}円`);
        addField(dl, "申請日時", date(row.created_at));
        addField(dl, "支払期限", date(row.payment_due_at));
        addField(dl, "利用期間", `${date(row.period_start)} ～ ${date(row.period_end)}`);
        if (row.paid_at) addField(dl, "入金確認日時", date(row.paid_at));
        card.append(top, dl);

        if (row.status === "pending") {
          const actions = document.createElement("div");
          actions.className = "actions";
          const button = document.createElement("button");
          button.className = "primary";
          button.type = "button";
          button.textContent = "入金確認済みにする";
          button.addEventListener("click", () => confirmPayment(row, button));
          actions.append(button);
          card.append(actions);
        }
        listEl.append(card);
      });
    }

    async function load() {
      reloadBtn.disabled = true;
      setStatus("振込申請を読み込んでいます…");
      try {
        const result = await callAdmin({ action:"list", status:selectedStatus });
        render(result.requests || []);
        setStatus(`${(result.requests || []).length}件を表示しています。`, "ok");
      } catch (error) {
        listEl.replaceChildren();
        setStatus(error.message || "読み込みに失敗しました。", "error");
      } finally {
        reloadBtn.disabled = false;
      }
    }

    async function confirmPayment(row, button) {
      if (!window.confirm(`${companyName(row)}の${Number(row.amount_yen).toLocaleString("ja-JP")}円を入金確認済みにしますか？`)) return;
      button.disabled = true;
      button.textContent = "反映しています…";
      try {
        await callAdmin({ action:"confirm", request_id:row.id });
        setStatus("入金確認を反映しました。", "ok");
        await load();
      } catch (error) {
        setStatus(error.message || "入金確認の反映に失敗しました。", "error");
        button.disabled = false;
        button.textContent = "入金確認済みにする";
      }
    }

    document.querySelectorAll(".tab").forEach((button) => {
      button.addEventListener("click", () => {
        selectedStatus = button.dataset.status;
        document.querySelectorAll(".tab").forEach((item) => {
          const active = item === button;
          item.classList.toggle("active", active);
          item.classList.toggle("primary", active);
          item.classList.toggle("secondary", !active);
        });
        load();
      });
    });
    reloadBtn.addEventListener("click", load);
    load();
  })();
  </script>
</body>
</html>
