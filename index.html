<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="人工管理" />
  <meta name="theme-color" content="#ffffff" />
  <title>人工管理</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root{
      --bg:#f3f6fb; --card:#fff; --text:#142033; --sub:#6b7280;
      --line:#dfe5ee; --accent:#2563eb; --danger:#b91c1c;
      --input:#2563eb; --sites:#16a34a; --workers:#7c3aed; --summary:#ea580c; --invoice:#0891b2;
      --soft-blue:#eaf2ff; --soft-green:#eaf8ef; --soft-purple:#f1ebff; --soft-orange:#fff0e6; --soft-cyan:#e7f8fb;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Yu Gothic",sans-serif}
    body{min-height:100vh;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
    header{
      position:sticky;top:0;z-index:10;background:linear-gradient(135deg,#ffffff 0%,#eef4ff 100%);
      backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
      padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
    }
    header h1{margin:0;font-size:20px}
    header p{margin:3px 0 0;color:var(--sub);font-size:12px}
    main{padding:14px;max-width:720px;margin:0 auto}
    .view{display:none}
    .view.active{display:block}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 5px 18px rgba(30,64,175,.05)}
    .card h2{font-size:16px;margin:0 0 12px}
    label{display:block;font-size:12px;color:var(--sub);margin:12px 0 6px}
    input,select,button{
      font:inherit;
    }
    input,select{
      width:100%;min-height:46px;border:1px solid #d1d5db;border-radius:12px;
      padding:10px 12px;background:white;color:var(--text);
    }
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .btn{
      width:100%;min-height:48px;border:0;border-radius:12px;padding:12px 14px;
      background:linear-gradient(135deg,var(--accent),#1d4ed8);color:white;font-weight:700;margin-top:12px;
      box-shadow:0 6px 14px rgba(37,99,235,.18);
    }
    .btn.secondary{background:#eef0f3;color:#111827}
    .btn.danger{background:#fee2e2;color:var(--danger)}
    .list{display:flex;flex-direction:column;gap:8px}
    .item{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff}
    .item strong{display:block;font-size:14px}
    .item small{color:var(--sub)}
    .item-line{display:flex;justify-content:space-between;gap:12px;align-items:center}
    .pill{font-size:12px;background:#eef0f3;padding:4px 8px;border-radius:999px;white-space:nowrap}
    .empty{color:var(--sub);font-size:13px;padding:10px 0}
    .summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .metric{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}
    .metric span{display:block;color:var(--sub);font-size:11px}
    .metric b{display:block;font-size:20px;margin-top:5px}
    nav{
      position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.98);
      border-top:1px solid var(--line);
      padding:8px 8px calc(8px + env(safe-area-inset-bottom));
      display:grid;grid-template-columns:repeat(5,1fr);gap:6px;
    }
    nav button{
      border:0;background:transparent;border-radius:14px;padding:8px 2px 7px;
      color:var(--sub);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;
    }
    nav button .nav-icon{font-size:20px;line-height:1}
    nav button[data-view="input"].active{background:var(--soft-blue);color:var(--input)}
    nav button[data-view="sites"].active{background:var(--soft-green);color:var(--sites)}
    nav button[data-view="workers"].active{background:var(--soft-purple);color:var(--workers)}
    nav button[data-view="summary"].active{background:var(--soft-orange);color:var(--summary)}
    nav button[data-view="invoice"].active{background:var(--soft-cyan);color:var(--invoice)}
    .notice{font-size:12px;color:var(--sub);line-height:1.6}
    #view-input .card:first-child{border-top:5px solid var(--input)}
    #view-sites .card:first-child{border-top:5px solid var(--sites)}
    #view-workers .card:first-child{border-top:5px solid var(--workers)}
    #view-summary .card:first-child{border-top:5px solid var(--summary)}
    #view-invoice .card:first-child{border-top:5px solid var(--invoice)}
    #view-input h2{color:var(--input)}
    #view-sites h2{color:var(--sites)}
    #view-workers h2{color:var(--workers)}
    #view-summary h2{color:var(--summary)}
    #view-invoice h2{color:var(--invoice)}
    .metric:nth-child(1){background:var(--soft-blue)}
    .metric:nth-child(2){background:var(--soft-purple)}
    .metric:nth-child(3){background:var(--soft-orange)}
    .metric:nth-child(4){background:var(--soft-green)}
    .cal-day{transition:.15s ease}
    .cal-day:active{transform:scale(.98);background:#f8fbff}
    .danger-link{border:0;background:transparent;color:var(--danger);font-size:12px;padding:4px 0}
    .edit-link{border:0;background:transparent;color:#2563eb;font-size:12px;padding:4px 6px}
    .item-actions{display:flex;gap:4px;align-items:center}
    .invoice-sheet{background:white;border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:12px}
    .invoice-title{text-align:center;font-size:26px;font-weight:800;letter-spacing:.12em;margin:4px 0 20px}
    .invoice-head{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
    .invoice-right{text-align:right}
    .invoice-table{width:100%;border-collapse:collapse;margin-top:16px;font-size:13px}
    .invoice-table th,.invoice-table td{border:1px solid #d1d5db;padding:8px;text-align:right}
    .invoice-table th:first-child,.invoice-table td:first-child{text-align:left}
    .invoice-total{font-size:22px;font-weight:800;text-align:right;margin-top:18px}
    .muted{color:var(--sub);font-size:12px}
    .section-title{font-size:13px;font-weight:800;margin:16px 0 8px}
    .calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
    .cal-head{text-align:center;font-size:11px;color:var(--sub);font-weight:700;padding:4px 0}
    .cal-day{min-height:74px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:7px;cursor:pointer}
    .cal-day.empty{background:transparent;border-color:transparent;cursor:default}
    .cal-date{font-size:12px;font-weight:800;margin-bottom:5px}
    .cal-chip{display:block;font-size:10px;line-height:1.15;background:#eef0f3;border-radius:7px;padding:3px 4px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .cal-more{font-size:10px;color:var(--sub);margin-top:4px}
    .client-color-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .color-choice{width:38px;height:38px;border-radius:10px;border:3px solid transparent;padding:0;cursor:pointer}
    .color-choice.selected{border-color:#111827;box-shadow:0 0 0 2px #fff inset}
    .client-dot{display:inline-block;width:10px;height:10px;border-radius:999px;margin-right:6px;vertical-align:-1px}
    .cal-client-bar{height:5px;border-radius:999px;margin-top:4px}
    .cal-client-tags{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}
    .cal-client-tag{width:12px;height:12px;border-radius:4px;border:1px solid rgba(0,0,0,.08)}
    .day-detail-title{font-weight:800;font-size:15px;margin-bottom:10px}
    @media(max-width:430px){
      .calendar{gap:4px}
      .cal-day{min-height:68px;padding:5px}
      .cal-chip{font-size:9px;padding:3px 4px}
    }
    @media print{
      header,nav,.no-print,main>section:not(#view-invoice){display:none!important}
      body{background:white;padding:0}
      main{padding:0;max-width:none}
      #view-invoice{display:block!important}
      #invoiceControls{display:none!important}
      .invoice-sheet{border:0;border-radius:0;margin:0;padding:20mm}
    }
    .member-row{display:grid;grid-template-columns:42px 1fr 86px 100px;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}
    .member-row input[type="checkbox"]{width:24px;height:24px;min-height:24px}
    .member-row select,.member-row input[type="number"]{min-height:40px;padding:7px 8px}
    .member-name{font-weight:700;font-size:14px}
    .member-rate{font-size:11px;color:var(--sub);margin-top:2px}
    .helper{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.5}
    .bulk-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    @media(max-width:430px){
      .member-row{grid-template-columns:36px 1fr 78px 86px;gap:6px;padding:9px 8px}
      .member-name{font-size:13px}
    }
  </style>
</head>
<body>
  <header>
    <h1>人工管理</h1>
    <p id="headerSub">今日の人工を入力</p>
  </header>

  <main>
    <section id="view-input" class="view active">
      <div class="card">
        <h2>まとめて人工入力</h2>
        <label>日付</label>
        <input id="entryDate" type="date">

        <label>現場</label>
        <select id="entrySite"></select>

        <label>その日の現場経費</label>
        <input id="siteDayExpense" inputmode="numeric" type="number" min="0" value="0" placeholder="例：高速・駐車場など">
        <input id="siteDayExpenseMemo" type="text" placeholder="経費メモ（任意）">

        <label>メンバー</label>
        <div id="bulkWorkerList" class="list"></div>

        <div class="bulk-actions">
          <button class="btn secondary" id="selectAllBtn" type="button">全員チェック</button>
          <button class="btn secondary" id="clearAllBtn" type="button">全員外す</button>
        </div>

        <div class="helper">メンバーなしでも、現場経費だけ登録できます。チェックしたメンバーだけ人工登録されます。</div>
        <button class="btn" id="addBulkEntryBtn">人工・経費を登録</button>
      </div>

      <div class="card">
        <h2>最近の入力</h2>
        <div id="recentEntries" class="list"></div>
      </div>
    </section>

    <section id="view-sites" class="view">
      <div class="card">
        <h2>現場登録</h2>
        <label>現場名</label>
        <input id="siteName" placeholder="例：○○倉庫新築工事">
        <label>元請け会社</label>
        <select id="siteClient"></select>
        <label>請負金額（任意）</label>
        <input id="siteRevenue" inputmode="numeric" type="number" min="0" placeholder="例：1200000">
        <label>現場別の例外単価 / 1人工（任意）</label>
        <input id="siteBillRate" inputmode="numeric" type="number" min="0" placeholder="未入力なら元請けの基本単価">
        <button class="btn" id="addSiteBtn">現場を追加</button>
      </div>
      <div class="card">
        <h2>元請け会社登録</h2>
        <label>会社名</label>
        <input id="clientName" placeholder="例：○○建設">
        <label>請求先住所（任意）</label>
        <input id="clientAddress" placeholder="例：兵庫県神戸市...">
        <label>基本人工単価</label>
        <input id="clientBillRate" inputmode="numeric" type="number" min="0" placeholder="例：30000">

        <label>カレンダー表示色</label>
        <div class="client-color-row" id="clientColorPicker">
          <button type="button" class="color-choice selected" data-color="#2563eb" style="background:#2563eb" aria-label="青"></button>
          <button type="button" class="color-choice" data-color="#16a34a" style="background:#16a34a" aria-label="緑"></button>
          <button type="button" class="color-choice" data-color="#7c3aed" style="background:#7c3aed" aria-label="紫"></button>
          <button type="button" class="color-choice" data-color="#ea580c" style="background:#ea580c" aria-label="オレンジ"></button>
          <button type="button" class="color-choice" data-color="#dc2626" style="background:#dc2626" aria-label="赤"></button>
          <button type="button" class="color-choice" data-color="#0891b2" style="background:#0891b2" aria-label="水色"></button>
          <button type="button" class="color-choice" data-color="#ca8a04" style="background:#ca8a04" aria-label="黄"></button>
          <button type="button" class="color-choice" data-color="#db2777" style="background:#db2777" aria-label="ピンク"></button>
        </div>
        <input id="clientColor" type="hidden" value="#2563eb">

        <div class="row">
          <div>
            <label>締め日（任意）</label>
            <input id="clientClosingDay" type="number" min="1" max="31" placeholder="例：20">
          </div>
          <div>
            <label>支払日メモ</label>
            <input id="clientPayment" placeholder="例：翌月末">
          </div>
        </div>
        <button class="btn" id="addClientBtn">元請け会社を追加</button>
      </div>
      <div class="card">
        <h2>元請け会社一覧</h2>
        <div id="clientList" class="list"></div>
      </div>
      <div class="card">
        <h2>現場一覧</h2>
        <div id="siteList" class="list"></div>
      </div>
    </section>

    <section id="view-workers" class="view">
      <div class="card">
        <h2>所属会社登録</h2>
        <label>会社名</label>
        <input id="workerCompanyName" placeholder="例：自社 / ○○興業">
        <label>基本支払人工単価</label>
        <input id="workerCompanyRate" inputmode="numeric" type="number" min="0" placeholder="例：20000">
        <button class="btn" id="addWorkerCompanyBtn">所属会社を追加</button>
      </div>
      <div class="card">
        <h2>所属会社一覧</h2>
        <div id="workerCompanyList" class="list"></div>
      </div>

      <div class="card">
        <h2>作業員登録</h2>
        <label>名前</label>
        <input id="workerName" placeholder="例：田中">
        <label>所属会社</label>
        <select id="workerCompany"></select>
        <label>作業員別の例外単価（任意）</label>
        <input id="workerRate" inputmode="numeric" type="number" min="0" placeholder="未入力なら所属会社の基本単価">
        <button class="btn" id="addWorkerBtn">作業員を追加</button>
      </div>
      <div class="card">
        <h2>作業員一覧</h2>
        <div id="workerList" class="list"></div>
      </div>
    </section>

    <section id="view-summary" class="view">
      <div class="card">
        <h2>集計</h2>
        <label>月</label>
        <input id="summaryMonth" type="month">
        <label>現場</label>
        <select id="summarySite"></select>
      </div>
      <div class="summary-grid" id="metrics"></div>

      <div class="card">
        <h2>月間カレンダー</h2>
        <div id="summaryCalendar"></div>
      </div>

      <div class="card" id="dayDetailCard">
        <h2>日別詳細</h2>
        <div id="dayDetail" class="empty">カレンダーの日付を押してな。</div>
      </div>

      <div class="card">
        <h2>作業員別</h2>
        <div id="workerSummary" class="list"></div>
      </div>
      <div class="card">
        <h2>所属会社別</h2>
        <div id="companySummary" class="list"></div>
      </div>
    </section>


    <section id="view-invoice" class="view">
      <div class="card no-print" id="invoiceControls">
        <h2>請求書作成</h2>
        <label>請求月</label>
        <input id="invoiceMonth" type="month">

        <label>元請け会社</label>
        <select id="invoiceClient"></select>

        <div class="row">
          <div>
            <label>消費税率</label>
            <select id="invoiceTax">
              <option value="10">10%</option>
              <option value="0">0%</option>
            </select>
          </div>
          <div>
            <label>請求書番号</label>
            <input id="invoiceNumber" placeholder="例：2026-08-001">
          </div>
        </div>

        <button class="btn" id="makeInvoiceBtn">請求書を作成</button>
        <button class="btn secondary" id="printInvoiceBtn">PDF保存・印刷</button>
      </div>

      <div id="invoicePreview"></div>
    </section>

    <section class="card">
      <div class="notice">
        データはこのSafari内に保存されます。Safariの履歴やWebサイトデータを消すと消える可能性があります。
        実運用前に、必要なら次の版でバックアップ・共有機能も追加できます。
      </div>
    </section>
  </main>

  <nav>
    <button data-view="input" class="active"><span class="nav-icon">✍️</span><span>入力</span></button>
    <button data-view="sites"><span class="nav-icon">🏗️</span><span>現場</span></button>
    <button data-view="workers"><span class="nav-icon">👷</span><span>作業員</span></button>
    <button data-view="summary"><span class="nav-icon">📊</span><span>集計</span></button>
    <button data-view="invoice"><span class="nav-icon">🧾</span><span>請求</span></button>
  </nav>

<script>
(function(){
  "use strict";

  const KEY = "jinkou_app_v3";
  const defaultState = { clients: [], workerCompanies: [], sites: [], workers: [], entries: [], siteExpenses: [] };
  let state = load();
  let editingClientId = "";
  let editingSiteId = "";
  let editingWorkerCompanyId = "";
  let editingWorkerId = "";
  if(!Array.isArray(state.clients)) state.clients = [];
  if(!Array.isArray(state.workerCompanies)) state.workerCompanies = [];
  if(!Array.isArray(state.siteExpenses)) state.siteExpenses = [];

  function safeStorage(){
    try{
      localStorage.setItem("__test__","1");
      localStorage.removeItem("__test__");
      return true;
    }catch(e){ return false; }
  }
  const hasStorage = safeStorage();

  function load(){
    try{
      const raw = localStorage.getItem(KEY);
      return raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(defaultState));
    }catch(e){
      return JSON.parse(JSON.stringify(defaultState));
    }
  }
  function save(){
    if(!hasStorage) return;
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  }

  const $ = id => document.getElementById(id);

  function dismissKeyboard(){
    try{
      const active = document.activeElement;
      if(active && typeof active.blur === "function") active.blur();
      document.querySelectorAll("input, textarea, select").forEach(el=>{
        if(el === document.activeElement && typeof el.blur === "function") el.blur();
      });
      document.body.setAttribute("tabindex","-1");
      document.body.focus({preventScroll:true});
    }catch(e){}
    setTimeout(()=>{
      try{
        if(document.activeElement && typeof document.activeElement.blur === "function"){
          document.activeElement.blur();
        }
      }catch(e){}
    }, 100);
  }

  function finishRegistration(message){
    dismissKeyboard();
    setTimeout(()=>{
      try{ window.scrollTo({top:0, behavior:"smooth"}); }catch(e){}
    }, 180);
    setTimeout(()=>alert(message), 320);
  }

  const yen = n => "¥" + Math.round(Number(n||0)).toLocaleString("ja-JP");
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

  function todayLocal(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${day}`;
  }
  function monthLocal(){
    return todayLocal().slice(0,7);
  }

  $("entryDate").value = todayLocal();
  $("summaryMonth").value = monthLocal();
  $("invoiceMonth").value = monthLocal();

  const viewLabels = {
    input:"今日の人工を入力",
    sites:"現場の登録・確認",
    workers:"作業員と単価",
    summary:"人工と利益を集計",
    invoice:"元請けごとの請求書を作成"
  };

  document.querySelectorAll("nav button").forEach(btn=>{
    btn.addEventListener("click", function(){
      const target = this.getAttribute("data-view");
      document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
      $("view-"+target).classList.add("active");
      document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
      this.classList.add("active");
      $("headerSub").textContent = viewLabels[target];

      const accentMap = {
        input:["#2563eb","#eaf2ff"],
        sites:["#16a34a","#eaf8ef"],
        workers:["#7c3aed","#f1ebff"],
        summary:["#ea580c","#fff0e6"],
        invoice:["#0891b2","#e7f8fb"]
      };
      const pair = accentMap[target] || accentMap.input;
      document.documentElement.style.setProperty("--accent", pair[0]);
      document.querySelector("header").style.background = `linear-gradient(135deg,#ffffff 0%,${pair[1]} 100%)`;

      if(target==="summary") renderSummary();
      if(target==="invoice") renderInvoice();
      window.scrollTo({top:0,behavior:"instant"});
    });
  });



  document.querySelectorAll("#clientColorPicker .color-choice").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      document.querySelectorAll("#clientColorPicker .color-choice").forEach(b=>b.classList.remove("selected"));
      btn.classList.add("selected");
      $("clientColor").value = btn.dataset.color || "#2563eb";
    });
  });

  $("addClientBtn").addEventListener("click", ()=>{
    const name = $("clientName").value.trim();
    if(!name){ alert("会社名を入れてな"); return; }

    const data = {
      name,
      address:$("clientAddress").value.trim(),
      billRate:Number($("clientBillRate").value||0),
      color:$("clientColor").value || "#2563eb",
      closingDay:Number($("clientClosingDay").value||0),
      payment:$("clientPayment").value.trim()
    };

    if(editingClientId){

  function renderCalendar(entries, month, siteFilter){
    siteFilter = siteFilter || "all";
    const box = $("summaryCalendar");
    if(!box) return;

    const [year, mon] = month.split("-").map(Number);
    const first = new Date(year, mon-1, 1);
    const lastDay = new Date(year, mon, 0).getDate();
    const startWeekday = first.getDay();

    const heads = ["日","月","火","水","木","金","土"]
      .map(d=>`<div class="cal-head">${d}</div>`).join("");

    let cells = "";
    for(let i=0;i<startWeekday;i++){
      cells += `<div class="cal-day empty"></div>`;
    }

    for(let day=1; day<=lastDay; day++){
      const date = `${year}-${String(mon).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
      const dayEntries = entries.filter(e=>e.date===date);
      const total = dayEntries.reduce((a,e)=>a+Number(e.jinko||0),0);
      const daySharedExpenses = state.siteExpenses.filter(x=>x.date===date && (siteFilter==="all" || x.siteId===siteFilter));
      const daySharedExpenseTotal = daySharedExpenses.reduce((a,x)=>a+Number(x.amount||0),0);

      const bySite = {};
      dayEntries.forEach(e=>{
        if(!bySite[e.siteId]) bySite[e.siteId] = 0;
        bySite[e.siteId] += Number(e.jinko||0);
      });

      const siteRows = Object.entries(bySite);
      const chips = siteRows.slice(0,3).map(([siteId,jinko])=>{
        const s = siteById(siteId);
        const c = s?.clientId ? clientById(s.clientId) : null;
        return `<span class="cal-chip" style="border-left:4px solid ${clientColor(c)}">${escapeHtml(s?.name||"不明")} / ${jinko.toFixed(jinko % 1 ? 1 : 0)}</span>`;
      }).join("");

      const clientIds = [...new Set(dayEntries.map(e=>{
        const s = siteById(e.siteId);
        return s?.clientId || "";
      }).filter(Boolean))];

      const clientTags = clientIds.map(cid=>{
        const c = clientById(cid);
        return `<span class="cal-client-tag" title="${escapeHtml(c?.name||"")}" style="background:${clientColor(c)}"></span>`;
      }).join("");

      const more = siteRows.length > 3 ? `<div class="cal-more">ほか${siteRows.length-3}現場</div>` : "";
      cells += `
        <div class="cal-day" onclick="showDayDetail('${date}')">
          <div class="cal-date">${day}日</div>
          ${clientTags ? `<div class="cal-client-tags">${clientTags}</div>` : ""}
          ${chips}${more}
        </div>`;
    }

    box.innerHTML = `<div class="calendar">${heads}${cells}</div>`;
  }

  function showDayDetail(date){
    const month = $("summaryMonth").value || monthLocal();
    const siteFilter = $("summarySite").value || "all";
    let entries = state.entries.filter(e=>e.date===date);
    if(siteFilter!=="all") entries = entries.filter(e=>e.siteId===siteFilter);

    const detail = $("dayDetail");
    let daySiteExpenses = state.siteExpenses.filter(x=>x.date===date);
    if(siteFilter!=="all") daySiteExpenses = daySiteExpenses.filter(x=>x.siteId===siteFilter);

    if(!entries.length && !daySiteExpenses.length){
      detail.className = "empty";
      detail.innerHTML = `${date} の入力はないで。`;
      return;
    }

    const siteIds = [...new Set([
      ...entries.map(e=>e.siteId),
      ...daySiteExpenses.map(x=>x.siteId)
    ])];

    const siteBlocks = siteIds.map(siteId=>{
      const s = siteById(siteId);
      const client = s?.clientId ? clientById(s.clientId) : null;
      const siteEntries = entries.filter(e=>e.siteId===siteId);
      const siteExpenseRows = daySiteExpenses.filter(x=>x.siteId===siteId);

      const workersHtml = siteEntries.length
        ? siteEntries.map(e=>{
            const w = workerById(e.workerId);
            const company = w?.companyId ? workerCompanyById(w.companyId) : null;
            return `<div class="item-line" style="padding:6px 0;border-bottom:1px solid var(--line)">
              <div>
                <strong>${escapeHtml(w?.name||"不明")} <span class="pill">${e.jinko}人工</span></strong>
                <small>${company ? escapeHtml(company.name) : "所属未設定"}${e.expense ? " / 個人経費 " + yen(e.expense) : ""}</small>
              </div>
            </div>`;
          }).join("")
        : `<div class="empty">人工入力なし</div>`;

      const expensesHtml = siteExpenseRows.length
        ? `<div style="margin-top:8px">${siteExpenseRows.map(x=>`
            <div class="item-line" style="padding:5px 0">
              <div>
                <strong>現場経費 ${yen(x.amount)}</strong>
                <small>${x.memo ? escapeHtml(x.memo) : "メモなし"}</small>
              </div>
            </div>
          `).join("")}</div>`
        : "";

      return `<div class="item" style="border-left:5px solid ${clientColor(client)}">
        <div style="margin-bottom:8px">
          <strong>${client ? `<span class="client-dot" style="background:${clientColor(client)}"></span>` : ""}${escapeHtml(s?.name||"不明")}</strong>
          <small>${client ? "元請け " + escapeHtml(client.name) : "元請け未設定"}</small>
        </div>
        ${workersHtml}
        ${expensesHtml}
      </div>`;
    }).join("");

    detail.className = "list";
    detail.innerHTML = `<div class="day-detail-title">${date}</div>${siteBlocks}`;
    try{$("dayDetailCard").scrollIntoView({behavior:"smooth",block:"start"});}catch(e){}
  }

  window.showDayDetail = showDayDetail;

  function renderSummary(){
    const month = $("summaryMonth").value || monthLocal();
    const siteFilter = $("summarySite").value || "all";
    let entries = state.entries.filter(e=>e.date.startsWith(month));
    if(siteFilter!=="all") entries = entries.filter(e=>e.siteId===siteFilter);

    renderCalendar(entries, month, siteFilter);

    const totalJinko = entries.reduce((a,e)=>a+Number(e.jinko||0),0);
    const labor = entries.reduce((a,e)=>{
      const w = workerById(e.workerId);
      return a + Number(e.jinko||0) * effectiveWorkerRate(w);
    },0);
    let siteExpenses = state.siteExpenses.filter(x=>x.date.startsWith(month));
    if(siteFilter!=="all") siteExpenses = siteExpenses.filter(x=>x.siteId===siteFilter);

    const workerExpenses = entries.reduce((a,e)=>a+Number(e.expense||0),0);
    const sharedExpenses = siteExpenses.reduce((a,e)=>a+Number(e.amount||0),0);
    const expenses = workerExpenses + sharedExpenses;

    let revenue = 0;
    if(siteFilter!=="all"){
      revenue = Number(siteById(siteFilter)?.revenue||0);
    }else{
      const used = new Set(entries.map(e=>e.siteId));
      revenue = state.sites.filter(s=>used.has(s.id)).reduce((a,s)=>a+Number(s.revenue||0),0);
    }
    const gross = revenue - labor - expenses;

    $("metrics").innerHTML = `
      <div class="metric"><span>人工</span><b>${totalJinko.toFixed(2)}</b></div>
      <div class="metric"><span>人件費</span><b>${yen(labor)}</b></div>
      <div class="metric"><span>経費</span><b>${yen(expenses)}</b></div>
      <div class="metric"><span>粗利</span><b>${yen(gross)}</b></div>
    `;

    const byWorker = {};
    entries.forEach(e=>{
      if(!byWorker[e.workerId]) byWorker[e.workerId]={jinko:0,cost:0};
      const w = workerById(e.workerId);
      byWorker[e.workerId].jinko += Number(e.jinko||0);
      byWorker[e.workerId].cost += Number(e.jinko||0)*effectiveWorkerRate(w);
    });

    const rows = Object.entries(byWorker).map(([wid,v])=>{
      const w = workerById(wid);
      return `<div class="item">
        <div class="item-line">
          <div>
            <strong>${escapeHtml(w?.name||"不明")}</strong>
            <small>${w?.companyId && workerCompanyById(w.companyId) ? escapeHtml(workerCompanyById(w.companyId).name) + " / " : ""}${v.jinko.toFixed(2)}人工</small>
          </div>
          <b>${yen(v.cost)}</b>
        </div>
      </div>`;
    }).join("");
    $("workerSummary").innerHTML = rows || `<div class="empty">この条件の入力はないで。</div>`;

    const byCompany = {};
    entries.forEach(e=>{
      const w = workerById(e.workerId);
      const cid = w?.companyId || "none";
      if(!byCompany[cid]) byCompany[cid]={jinko:0,cost:0};
      byCompany[cid].jinko += Number(e.jinko||0);
      byCompany[cid].cost += Number(e.jinko||0)*effectiveWorkerRate(w);
    });

    const companyRows = Object.entries(byCompany).map(([cid,v])=>{
      const c = cid==="none" ? null : workerCompanyById(cid);
      return `<div class="item">
        <div class="item-line">
          <div>
            <strong>${escapeHtml(c?.name || "未設定")}</strong>
            <small>${v.jinko.toFixed(2)}人工</small>
          </div>
          <b>${yen(v.cost)}</b>
        </div>
      </div>`;
    }).join("");
    $("companySummary").innerHTML = companyRows || `<div class="empty">この条件の入力はないで。</div>`;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({
      "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"
    }[c]));
  }


  function invoiceRowsFor(clientId, month){
    const clientSites = state.sites.filter(s=>s.clientId===clientId);
    const siteIds = new Set(clientSites.map(s=>s.id));
    const entries = state.entries.filter(e=>e.date.startsWith(month) && siteIds.has(e.siteId));

    return clientSites.map(site=>{
      const siteEntries = entries.filter(e=>e.siteId===site.id);
      const jinko = siteEntries.reduce((a,e)=>a+Number(e.jinko||0),0);
      const workerExpenses = siteEntries.reduce((a,e)=>a+Number(e.expense||0),0);
      const sharedExpenses = state.siteExpenses
        .filter(x=>x.siteId===site.id && x.date.startsWith(month))
        .reduce((a,x)=>a+Number(x.amount||0),0);
      const expenses = workerExpenses + sharedExpenses;
      const client = clientById(site.clientId);
      const rate = Number(site.billRate || client?.billRate || 0);
      const laborAmount = jinko * rate;
      return {
        site,
        jinko,
        rate,
        laborAmount,
        expenses,
        amount: laborAmount + expenses
      };
    }).filter(r=>r.jinko>0 || r.expenses>0);
  }

  function renderInvoice(){
    const clientId = $("invoiceClient").value;
    const month = $("invoiceMonth").value || monthLocal();
    const taxRate = Number($("invoiceTax").value||0);
    const number = $("invoiceNumber").value.trim();

    if(!clientId){
      $("invoicePreview").innerHTML = `<div class="card"><div class="empty">元請け会社を選んでな。</div></div>`;
      return;
    }

    const client = clientById(clientId);
    const rows = invoiceRowsFor(clientId, month);

    if(!rows.length){
      $("invoicePreview").innerHTML = `<div class="card"><div class="empty">この月の請求対象データがないで。</div></div>`;
      return;
    }

    const subtotal = rows.reduce((a,r)=>a+r.amount,0);
    const tax = Math.floor(subtotal * taxRate / 100);
    const total = subtotal + tax;
    const [y,m] = month.split("-");

    const trs = rows.map(r=>`
      <tr>
        <td>${escapeHtml(r.site.name)}</td>
        <td>${r.jinko.toFixed(2)}</td>
        <td>${yen(r.rate)}</td>
        <td>${yen(r.laborAmount)}</td>
        <td>${yen(r.expenses)}</td>
        <td>${yen(r.amount)}</td>
      </tr>
    `).join("");

    $("invoicePreview").innerHTML = `
      <div class="invoice-sheet">
        <div class="invoice-title">請 求 書</div>

        <div class="invoice-head">
          <div>
            <div style="font-size:20px;font-weight:800">${escapeHtml(client?.name||"")} 御中</div>
            <div class="muted" style="margin-top:6px">${escapeHtml(client?.address||"")}</div>
            <div style="margin-top:22px;font-size:14px">${y}年${Number(m)}月分</div>
          </div>
          <div class="invoice-right">
            <div>請求書番号：${escapeHtml(number||"-")}</div>
            <div style="margin-top:8px">発行日：${todayLocal()}</div>
            <div style="margin-top:18px;font-weight:800">株式会社REFISE</div>
          </div>
        </div>

        <div class="section-title">下記の通りご請求申し上げます。</div>
        <div class="invoice-total">ご請求金額　${yen(total)}（税込）</div>

        <table class="invoice-table">
          <thead>
            <tr>
              <th>現場</th>
              <th>人工</th>
              <th>単価</th>
              <th>人工金額</th>
              <th>経費</th>
              <th>金額</th>
            </tr>
          </thead>
          <tbody>${trs}</tbody>
        </table>

        <table class="invoice-table" style="margin-left:auto;width:360px;max-width:100%">
          <tbody>
            <tr><th>小計</th><td>${yen(subtotal)}</td></tr>
            <tr><th>消費税 ${taxRate}%</th><td>${yen(tax)}</td></tr>
            <tr><th>合計</th><td><strong>${yen(total)}</strong></td></tr>
          </tbody>
        </table>

        ${client?.payment ? `<div class="muted" style="margin-top:18px">支払条件：${escapeHtml(client.payment)}</div>` : ""}
      </div>
    `;
  }

  $("makeInvoiceBtn").addEventListener("click", renderInvoice);
  $("printInvoiceBtn").addEventListener("click", ()=>{
    renderInvoice();
    setTimeout(()=>window.print(), 50);
  });
  $("invoiceMonth").addEventListener("change", renderInvoice);
  $("invoiceClient").addEventListener("change", renderInvoice);
  $("invoiceTax").addEventListener("change", renderInvoice);

  function renderAll(){
    renderClients();
    renderWorkerCompanies();
    renderSelects();
    renderSites();
    renderWorkers();
    renderRecent();
    renderSummary();
    if($("invoiceClient")) renderInvoice();
  }

  renderAll();

  if(!hasStorage){
    setTimeout(()=>alert("この開き方ではSafariの保存機能が使えへんみたい。URLとして公開して開く必要があるで。"), 400);
  }
})();
</script>
</body>
</html>
