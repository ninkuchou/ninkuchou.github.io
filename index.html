<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="人工管理" />
  <meta name="theme-color" content="#ffffff" />
  <title>人工管理</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root{
      --bg:#f5f6f8; --card:#fff; --text:#111827; --sub:#6b7280;
      --line:#e5e7eb; --accent:#111827; --danger:#b91c1c;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Yu Gothic",sans-serif}
    body{min-height:100vh;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
    header{
      position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);
      backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
      padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
    }
    header h1{margin:0;font-size:20px}
    header p{margin:3px 0 0;color:var(--sub);font-size:12px}
    main{padding:14px;max-width:720px;margin:0 auto}
    .view{display:none}
    .view.active{display:block}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
    .card h2{font-size:16px;margin:0 0 12px}
    label{display:block;font-size:12px;color:var(--sub);margin:12px 0 6px}
    input,select,button{
      font:inherit;
    }
    input,select{
      width:100%;min-height:46px;border:1px solid #d1d5db;border-radius:12px;
      padding:10px 12px;background:white;color:var(--text);
    }
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .btn{
      width:100%;min-height:48px;border:0;border-radius:12px;padding:12px 14px;
      background:var(--accent);color:white;font-weight:700;margin-top:12px;
    }
    .btn.secondary{background:#eef0f3;color:#111827}
    .btn.danger{background:#fee2e2;color:var(--danger)}
    .list{display:flex;flex-direction:column;gap:8px}
    .item{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff}
    .item strong{display:block;font-size:14px}
    .item small{color:var(--sub)}
    .item-line{display:flex;justify-content:space-between;gap:12px;align-items:center}
    .pill{font-size:12px;background:#eef0f3;padding:4px 8px;border-radius:999px;white-space:nowrap}
    .empty{color:var(--sub);font-size:13px;padding:10px 0}
    .summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .metric{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}
    .metric span{display:block;color:var(--sub);font-size:11px}
    .metric b{display:block;font-size:20px;margin-top:5px}
    nav{
      position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.98);
      border-top:1px solid var(--line);
      padding:8px 8px calc(8px + env(safe-area-inset-bottom));
      display:grid;grid-template-columns:repeat(5,1fr);gap:6px;
    }
    nav button{
      border:0;background:transparent;border-radius:12px;padding:10px 4px;
      color:var(--sub);font-size:12px;font-weight:700;
    }
    nav button.active{background:#111827;color:#fff}
    .notice{font-size:12px;color:var(--sub);line-height:1.6}
    .danger-link{border:0;background:transparent;color:var(--danger);font-size:12px;padding:4px 0}
    .invoice-sheet{background:white;border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:12px}
    .invoice-title{text-align:center;font-size:26px;font-weight:800;letter-spacing:.12em;margin:4px 0 20px}
    .invoice-head{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
    .invoice-right{text-align:right}
    .invoice-table{width:100%;border-collapse:collapse;margin-top:16px;font-size:13px}
    .invoice-table th,.invoice-table td{border:1px solid #d1d5db;padding:8px;text-align:right}
    .invoice-table th:first-child,.invoice-table td:first-child{text-align:left}
    .invoice-total{font-size:22px;font-weight:800;text-align:right;margin-top:18px}
    .muted{color:var(--sub);font-size:12px}
    .section-title{font-size:13px;font-weight:800;margin:16px 0 8px}
    @media print{
      header,nav,.no-print,main>section:not(#view-invoice){display:none!important}
      body{background:white;padding:0}
      main{padding:0;max-width:none}
      #view-invoice{display:block!important}
      #invoiceControls{display:none!important}
      .invoice-sheet{border:0;border-radius:0;margin:0;padding:20mm}
    }
    .member-row{display:grid;grid-template-columns:42px 1fr 86px 100px;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}
    .member-row input[type="checkbox"]{width:24px;height:24px;min-height:24px}
    .member-row select,.member-row input[type="number"]{min-height:40px;padding:7px 8px}
    .member-name{font-weight:700;font-size:14px}
    .member-rate{font-size:11px;color:var(--sub);margin-top:2px}
    .helper{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.5}
    .bulk-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    @media(max-width:430px){
      .member-row{grid-template-columns:36px 1fr 78px 86px;gap:6px;padding:9px 8px}
      .member-name{font-size:13px}
    }
  </style>
</head>
<body>
  <header>
    <h1>人工管理</h1>
    <p id="headerSub">今日の人工を入力</p>
  </header>

  <main>
    <section id="view-input" class="view active">
      <div class="card">
        <h2>まとめて人工入力</h2>
        <label>日付</label>
        <input id="entryDate" type="date">

        <label>現場</label>
        <select id="entrySite"></select>

        <label>メンバー</label>
        <div id="bulkWorkerList" class="list"></div>

        <div class="bulk-actions">
          <button class="btn secondary" id="selectAllBtn" type="button">全員チェック</button>
          <button class="btn secondary" id="clearAllBtn" type="button">全員外す</button>
        </div>

        <div class="helper">チェックしたメンバーだけ登録されます。人工と経費は一人ずつ変更できます。</div>
        <button class="btn" id="addBulkEntryBtn">チェックしたメンバーをまとめて登録</button>
      </div>

      <div class="card">
        <h2>最近の入力</h2>
        <div id="recentEntries" class="list"></div>
      </div>
    </section>

    <section id="view-sites" class="view">
      <div class="card">
        <h2>現場登録</h2>
        <label>現場名</label>
        <input id="siteName" placeholder="例：○○倉庫新築工事">
        <label>元請け会社</label>
        <select id="siteClient"></select>
        <label>請負金額（任意）</label>
        <input id="siteRevenue" inputmode="numeric" type="number" min="0" placeholder="例：1200000">
        <label>現場別の例外単価 / 1人工（任意）</label>
        <input id="siteBillRate" inputmode="numeric" type="number" min="0" placeholder="未入力なら元請けの基本単価">
        <button class="btn" id="addSiteBtn">現場を追加</button>
      </div>
      <div class="card">
        <h2>元請け会社登録</h2>
        <label>会社名</label>
        <input id="clientName" placeholder="例：○○建設">
        <label>請求先住所（任意）</label>
        <input id="clientAddress" placeholder="例：兵庫県神戸市...">
        <label>基本人工単価</label>
        <input id="clientBillRate" inputmode="numeric" type="number" min="0" placeholder="例：30000">
        <div class="row">
          <div>
            <label>締め日（任意）</label>
            <input id="clientClosingDay" type="number" min="1" max="31" placeholder="例：20">
          </div>
          <div>
            <label>支払日メモ</label>
            <input id="clientPayment" placeholder="例：翌月末">
          </div>
        </div>
        <button class="btn" id="addClientBtn">元請け会社を追加</button>
      </div>
      <div class="card">
        <h2>元請け会社一覧</h2>
        <div id="clientList" class="list"></div>
      </div>
      <div class="card">
        <h2>現場一覧</h2>
        <div id="siteList" class="list"></div>
      </div>
    </section>

    <section id="view-workers" class="view">
      <div class="card">
        <h2>所属会社登録</h2>
        <label>会社名</label>
        <input id="workerCompanyName" placeholder="例：自社 / ○○興業">
        <button class="btn" id="addWorkerCompanyBtn">所属会社を追加</button>
      </div>
      <div class="card">
        <h2>所属会社一覧</h2>
        <div id="workerCompanyList" class="list"></div>
      </div>

      <div class="card">
        <h2>作業員登録</h2>
        <label>名前</label>
        <input id="workerName" placeholder="例：田中">
        <label>所属会社</label>
        <select id="workerCompany"></select>
        <label>1人工単価</label>
        <input id="workerRate" inputmode="numeric" type="number" min="0" placeholder="例：19000">
        <button class="btn" id="addWorkerBtn">作業員を追加</button>
      </div>
      <div class="card">
        <h2>作業員一覧</h2>
        <div id="workerList" class="list"></div>
      </div>
    </section>

    <section id="view-summary" class="view">
      <div class="card">
        <h2>集計</h2>
        <label>月</label>
        <input id="summaryMonth" type="month">
        <label>現場</label>
        <select id="summarySite"></select>
      </div>
      <div class="summary-grid" id="metrics"></div>
      <div class="card">
        <h2>作業員別</h2>
        <div id="workerSummary" class="list"></div>
      </div>
      <div class="card">
        <h2>所属会社別</h2>
        <div id="companySummary" class="list"></div>
      </div>
    </section>


    <section id="view-invoice" class="view">
      <div class="card no-print" id="invoiceControls">
        <h2>請求書作成</h2>
        <label>請求月</label>
        <input id="invoiceMonth" type="month">

        <label>元請け会社</label>
        <select id="invoiceClient"></select>

        <div class="row">
          <div>
            <label>消費税率</label>
            <select id="invoiceTax">
              <option value="10">10%</option>
              <option value="0">0%</option>
            </select>
          </div>
          <div>
            <label>請求書番号</label>
            <input id="invoiceNumber" placeholder="例：2026-08-001">
          </div>
        </div>

        <button class="btn" id="makeInvoiceBtn">請求書を作成</button>
        <button class="btn secondary" id="printInvoiceBtn">PDF保存・印刷</button>
      </div>

      <div id="invoicePreview"></div>
    </section>

    <section class="card">
      <div class="notice">
        データはこのSafari内に保存されます。Safariの履歴やWebサイトデータを消すと消える可能性があります。
        実運用前に、必要なら次の版でバックアップ・共有機能も追加できます。
      </div>
    </section>
  </main>

  <nav>
    <button data-view="input" class="active">入力</button>
    <button data-view="sites">現場</button>
    <button data-view="workers">作業員</button>
    <button data-view="summary">集計</button>
    <button data-view="invoice">請求</button>
  </nav>

<script>
(function(){
  "use strict";

  const KEY = "jinkou_app_v3";
  const defaultState = { clients: [], workerCompanies: [], sites: [], workers: [], entries: [] };
  let state = load();
  if(!Array.isArray(state.clients)) state.clients = [];
  if(!Array.isArray(state.workerCompanies)) state.workerCompanies = [];

  function safeStorage(){
    try{
      localStorage.setItem("__test__","1");
      localStorage.removeItem("__test__");
      return true;
    }catch(e){ return false; }
  }
  const hasStorage = safeStorage();

  function load(){
    try{
      const raw = localStorage.getItem(KEY);
      return raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(defaultState));
    }catch(e){
      return JSON.parse(JSON.stringify(defaultState));
    }
  }
  function save(){
    if(!hasStorage) return;
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  }

  const $ = id => document.getElementById(id);

  function dismissKeyboard(){
    try{
      const active = document.activeElement;
      if(active && typeof active.blur === "function") active.blur();
      document.querySelectorAll("input, textarea, select").forEach(el=>{
        if(el === document.activeElement && typeof el.blur === "function") el.blur();
      });
      document.body.setAttribute("tabindex","-1");
      document.body.focus({preventScroll:true});
    }catch(e){}
    setTimeout(()=>{
      try{
        if(document.activeElement && typeof document.activeElement.blur === "function"){
          document.activeElement.blur();
        }
      }catch(e){}
    }, 100);
  }

  function finishRegistration(message){
    dismissKeyboard();
    setTimeout(()=>{
      try{ window.scrollTo({top:0, behavior:"smooth"}); }catch(e){}
    }, 180);
    setTimeout(()=>alert(message), 320);
  }

  const yen = n => "¥" + Math.round(Number(n||0)).toLocaleString("ja-JP");
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

  function todayLocal(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${day}`;
  }
  function monthLocal(){
    return todayLocal().slice(0,7);
  }

  $("entryDate").value = todayLocal();
  $("summaryMonth").value = monthLocal();
  $("invoiceMonth").value = monthLocal();

  const viewLabels = {
    input:"今日の人工を入力",
    sites:"現場の登録・確認",
    workers:"作業員と単価",
    summary:"人工と利益を集計",
    invoice:"元請けごとの請求書を作成"
  };

  document.querySelectorAll("nav button").forEach(btn=>{
    btn.addEventListener("click", function(){
      const target = this.getAttribute("data-view");
      document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
      $("view-"+target).classList.add("active");
      document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
      this.classList.add("active");
      $("headerSub").textContent = viewLabels[target];
      if(target==="summary") renderSummary();
      if(target==="invoice") renderInvoice();
      window.scrollTo({top:0,behavior:"instant"});
    });
  });


  $("addClientBtn").addEventListener("click", ()=>{
    const name = $("clientName").value.trim();
    if(!name){ alert("会社名を入れてな"); return; }
    state.clients.push({
      id:uid(),
      name,
      address:$("clientAddress").value.trim(),
      billRate:Number($("clientBillRate").value||0),
      closingDay:Number($("clientClosingDay").value||0),
      payment:$("clientPayment").value.trim()
    });
    save();
    $("clientName").value="";
    $("clientAddress").value="";
    $("clientBillRate").value="";
    $("clientClosingDay").value="";
    $("clientPayment").value="";
    renderAll();
    finishRegistration("元請け会社を追加したで");
  });

  $("addSiteBtn").addEventListener("click", ()=>{
    const name = $("siteName").value.trim();
    if(!name){ alert("現場名を入れてな"); return; }
    state.sites.push({
      id:uid(),
      name,
      clientId:$("siteClient").value || "",
      revenue:Number($("siteRevenue").value||0),
      billRate:Number($("siteBillRate").value||0)
    });
    save();
    $("siteName").value="";
    $("siteRevenue").value="";
    $("siteBillRate").value="";
    renderAll();
    finishRegistration("現場を追加したで");
  });


  $("addWorkerCompanyBtn").addEventListener("click", ()=>{
    const name = $("workerCompanyName").value.trim();
    if(!name){ alert("会社名を入れてな"); return; }
    state.workerCompanies.push({id:uid(), name});
    save();
    $("workerCompanyName").value="";
    renderAll();
    finishRegistration("所属会社を追加したで");
  });

  $("addWorkerBtn").addEventListener("click", ()=>{
    const name = $("workerName").value.trim();
    const rate = Number($("workerRate").value||0);
    if(!name){ alert("名前を入れてな"); return; }
    state.workers.push({
      id:uid(),
      name,
      companyId:$("workerCompany").value || "",
      rate
    });
    save();
    $("workerName").value="";
    $("workerRate").value="";
    renderAll();
    finishRegistration("作業員を追加したで");
  });

  $("summaryMonth").addEventListener("change", renderSummary);
  $("summarySite").addEventListener("change", renderSummary);

  function clientById(id){ return state.clients.find(x=>x.id===id); }
  function workerCompanyById(id){ return state.workerCompanies.find(x=>x.id===id); }
  function siteById(id){ return state.sites.find(x=>x.id===id); }
  function workerById(id){ return state.workers.find(x=>x.id===id); }


  function removeClient(id){
    const used = state.sites.some(s=>s.clientId===id);
    if(used){
      alert("この元請け会社は現場で使われてるから、先に現場側を変更してな");
      return;
    }
    if(!confirm("この元請け会社を削除する？")) return;
    state.clients = state.clients.filter(x=>x.id!==id);
    save(); renderAll();
  }

  function removeSite(id){
    if(!confirm("この現場を削除する？関連する人工入力も消えるで。")) return;
    state.sites = state.sites.filter(x=>x.id!==id);
    state.entries = state.entries.filter(x=>x.siteId!==id);
    save(); renderAll();
  }

  function removeWorkerCompany(id){
    const used = state.workers.some(w=>w.companyId===id);
    if(used){
      alert("この会社は作業員で使われてるから、先に作業員側を変更してな");
      return;
    }
    if(!confirm("この所属会社を削除する？")) return;
    state.workerCompanies = state.workerCompanies.filter(x=>x.id!==id);
    save(); renderAll();
  }

  function removeWorker(id){
    if(!confirm("この作業員を削除する？関連する人工入力も消えるで。")) return;
    state.workers = state.workers.filter(x=>x.id!==id);
    state.entries = state.entries.filter(x=>x.workerId!==id);
    save(); renderAll();
  }
  function removeEntry(id){
    if(!confirm("この入力を削除する？")) return;
    state.entries = state.entries.filter(x=>x.id!==id);
    save(); renderAll();
  }

  window.removeClient = removeClient;
  window.removeSite = removeSite;
  window.removeWorkerCompany = removeWorkerCompany;
  window.removeWorker = removeWorker;
  window.removeEntry = removeEntry;


  function renderBulkWorkers(){
    const box = $("bulkWorkerList");
    if(!box) return;
    if(!state.workers.length){
      box.innerHTML = `<div class="empty">先に作業員を登録してな。</div>`;
      return;
    }
    box.innerHTML = state.workers.map(w=>`
      <div class="member-row">
        <input class="bulk-check" type="checkbox" data-worker-id="${w.id}" checked>
        <div>
          <div class="member-name">${escapeHtml(w.name)}</div>
          <div class="member-rate">${w.companyId && workerCompanyById(w.companyId) ? escapeHtml(workerCompanyById(w.companyId).name) + " / " : ""}${yen(w.rate)} / 1人工</div>
        </div>
        <select class="bulk-jinko" data-worker-id="${w.id}">
          <option value="1" selected>1.0</option>
          <option value="0.5">0.5</option>
          <option value="0.25">0.25</option>
        </select>
        <input class="bulk-expense" data-worker-id="${w.id}" type="number" min="0" inputmode="numeric" value="0" placeholder="経費">
      </div>
    `).join("");
  }

  $("selectAllBtn").addEventListener("click", ()=>{
    document.querySelectorAll(".bulk-check").forEach(x=>x.checked=true);
  });

  $("clearAllBtn").addEventListener("click", ()=>{
    document.querySelectorAll(".bulk-check").forEach(x=>x.checked=false);
  });

  $("addBulkEntryBtn").addEventListener("click", ()=>{
    if(!state.sites.length){ alert("先に現場を登録してな"); return; }
    if(!state.workers.length){ alert("先に作業員を登録してな"); return; }

    const date = $("entryDate").value;
    const siteId = $("entrySite").value;
    const checked = [...document.querySelectorAll(".bulk-check:checked")];

    if(!date){ alert("日付を選んでな"); return; }
    if(!siteId){ alert("現場を選んでな"); return; }
    if(!checked.length){ alert("登録するメンバーをチェックしてな"); return; }

    checked.forEach(chk=>{
      const workerId = chk.dataset.workerId;
      const jinkoEl = document.querySelector(`.bulk-jinko[data-worker-id="${workerId}"]`);
      const expenseEl = document.querySelector(`.bulk-expense[data-worker-id="${workerId}"]`);
      state.entries.push({
        id:uid(),
        date,
        siteId,
        workerId,
        jinko:Number(jinkoEl?.value||1),
        expense:Number(expenseEl?.value||0)
      });
    });

    save();
    document.querySelectorAll(".bulk-expense").forEach(x=>x.value="0");
    dismissKeyboard();
    renderRecent();
    renderSummary();
    alert(checked.length + "人分まとめて登録したで");
  });

  function renderSelects(){
    const invoiceClient = $("invoiceClient");
    if(invoiceClient){
      invoiceClient.innerHTML = state.clients.length
        ? state.clients.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("")
        : `<option value="">元請け会社を登録してな</option>`;
    }

    const siteOptions = state.sites.map(s=>{
      const c = s.clientId ? clientById(s.clientId) : null;
      const label = c ? `${s.name}｜${c.name}` : s.name;
      return `<option value="${s.id}">${escapeHtml(label)}</option>`;
    }).join("");
    $("entrySite").innerHTML = siteOptions || `<option value="">現場を登録してな</option>`;
    $("summarySite").innerHTML = `<option value="all">すべての現場</option>` + siteOptions;

    renderBulkWorkers();
  }


  function renderClients(){
    const select = $("siteClient");
    if(select){
      const opts = state.clients.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("");
      select.innerHTML = `<option value="">未選択</option>` + opts;
    }

    const list = $("clientList");
    if(!list) return;
    if(!state.clients.length){
      list.innerHTML = `<div class="empty">まだ元請け会社がないで。</div>`;
      return;
    }
    list.innerHTML = state.clients.map(c=>`
      <div class="item">
        <div class="item-line">
          <div>
            <strong>${escapeHtml(c.name)}</strong>
            <small>${c.billRate ? "基本単価 " + yen(c.billRate) + " / " : ""}${c.closingDay ? c.closingDay + "日締め" : "締め日未設定"}${c.payment ? " / " + escapeHtml(c.payment) : ""}</small>
          </div>
          <button class="danger-link" onclick="removeClient('${c.id}')">削除</button>
        </div>
      </div>`).join("");
  }

  function renderSites(){
    if(!state.sites.length){
      $("siteList").innerHTML = `<div class="empty">まだ現場がないで。</div>`;
      return;
    }
    $("siteList").innerHTML = state.sites.map(s=>`
      <div class="item">
        <div class="item-line">
          <div>
            <strong>${escapeHtml(s.name)}</strong>
            <small>${s.clientId && clientById(s.clientId) ? "元請け " + escapeHtml(clientById(s.clientId).name) + " / " : ""}請負 ${s.revenue ? yen(s.revenue) : "未設定"}${s.billRate ? " / 例外単価 " + yen(s.billRate) : ""}</small>
          </div>
          <button class="danger-link" onclick="removeSite('${s.id}')">削除</button>
        </div>
      </div>`).join("");
  }


  function renderWorkerCompanies(){
    const select = $("workerCompany");
    if(select){
      const opts = state.workerCompanies.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("");
      select.innerHTML = `<option value="">未選択</option>` + opts;
    }

    const list = $("workerCompanyList");
    if(!list) return;
    if(!state.workerCompanies.length){
      list.innerHTML = `<div class="empty">まだ所属会社がないで。</div>`;
      return;
    }
    list.innerHTML = state.workerCompanies.map(c=>`
      <div class="item">
        <div class="item-line">
          <div><strong>${escapeHtml(c.name)}</strong></div>
          <button class="danger-link" onclick="removeWorkerCompany('${c.id}')">削除</button>
        </div>
      </div>`).join("");
  }

  function renderWorkers(){
    if(!state.workers.length){
      $("workerList").innerHTML = `<div class="empty">まだ作業員がないで。</div>`;
      return;
    }
    $("workerList").innerHTML = state.workers.map(w=>`
      <div class="item">
        <div class="item-line">
          <div>
            <strong>${escapeHtml(w.name)}</strong>
            <small>${w.companyId && workerCompanyById(w.companyId) ? escapeHtml(workerCompanyById(w.companyId).name) + " / " : ""}${yen(w.rate)} / 1人工</small>
          </div>
          <button class="danger-link" onclick="removeWorker('${w.id}')">削除</button>
        </div>
      </div>`).join("");
  }

  function renderRecent(){
    const list = [...state.entries].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,15);
    if(!list.length){
      $("recentEntries").innerHTML = `<div class="empty">まだ入力がないで。</div>`;
      return;
    }
    $("recentEntries").innerHTML = list.map(e=>{
      const s = siteById(e.siteId);
      const w = workerById(e.workerId);
      return `<div class="item">
        <div class="item-line">
          <div>
            <strong>${escapeHtml(w?.name||"不明")} <span class="pill">${e.jinko}人工</span></strong>
            <small>${e.date} / ${escapeHtml(s?.name||"不明")}${e.expense?` / 経費 ${yen(e.expense)}`:""}</small>
          </div>
          <button class="danger-link" onclick="removeEntry('${e.id}')">削除</button>
        </div>
      </div>`;
    }).join("");
  }

  function renderSummary(){
    const month = $("summaryMonth").value || monthLocal();
    const siteFilter = $("summarySite").value || "all";
    let entries = state.entries.filter(e=>e.date.startsWith(month));
    if(siteFilter!=="all") entries = entries.filter(e=>e.siteId===siteFilter);

    const totalJinko = entries.reduce((a,e)=>a+Number(e.jinko||0),0);
    const labor = entries.reduce((a,e)=>{
      const w = workerById(e.workerId);
      return a + Number(e.jinko||0) * Number(w?.rate||0);
    },0);
    const expenses = entries.reduce((a,e)=>a+Number(e.expense||0),0);

    let revenue = 0;
    if(siteFilter!=="all"){
      revenue = Number(siteById(siteFilter)?.revenue||0);
    }else{
      const used = new Set(entries.map(e=>e.siteId));
      revenue = state.sites.filter(s=>used.has(s.id)).reduce((a,s)=>a+Number(s.revenue||0),0);
    }
    const gross = revenue - labor - expenses;

    $("metrics").innerHTML = `
      <div class="metric"><span>人工</span><b>${totalJinko.toFixed(2)}</b></div>
      <div class="metric"><span>人件費</span><b>${yen(labor)}</b></div>
      <div class="metric"><span>経費</span><b>${yen(expenses)}</b></div>
      <div class="metric"><span>粗利</span><b>${yen(gross)}</b></div>
    `;

    const byWorker = {};
    entries.forEach(e=>{
      if(!byWorker[e.workerId]) byWorker[e.workerId]={jinko:0,cost:0};
      const w = workerById(e.workerId);
      byWorker[e.workerId].jinko += Number(e.jinko||0);
      byWorker[e.workerId].cost += Number(e.jinko||0)*Number(w?.rate||0);
    });

    const rows = Object.entries(byWorker).map(([wid,v])=>{
      const w = workerById(wid);
      return `<div class="item">
        <div class="item-line">
          <div>
            <strong>${escapeHtml(w?.name||"不明")}</strong>
            <small>${w?.companyId && workerCompanyById(w.companyId) ? escapeHtml(workerCompanyById(w.companyId).name) + " / " : ""}${v.jinko.toFixed(2)}人工</small>
          </div>
          <b>${yen(v.cost)}</b>
        </div>
      </div>`;
    }).join("");
    $("workerSummary").innerHTML = rows || `<div class="empty">この条件の入力はないで。</div>`;

    const byCompany = {};
    entries.forEach(e=>{
      const w = workerById(e.workerId);
      const cid = w?.companyId || "none";
      if(!byCompany[cid]) byCompany[cid]={jinko:0,cost:0};
      byCompany[cid].jinko += Number(e.jinko||0);
      byCompany[cid].cost += Number(e.jinko||0)*Number(w?.rate||0);
    });

    const companyRows = Object.entries(byCompany).map(([cid,v])=>{
      const c = cid==="none" ? null : workerCompanyById(cid);
      return `<div class="item">
        <div class="item-line">
          <div>
            <strong>${escapeHtml(c?.name || "未設定")}</strong>
            <small>${v.jinko.toFixed(2)}人工</small>
          </div>
          <b>${yen(v.cost)}</b>
        </div>
      </div>`;
    }).join("");
    $("companySummary").innerHTML = companyRows || `<div class="empty">この条件の入力はないで。</div>`;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({
      "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"
    }[c]));
  }


  function invoiceRowsFor(clientId, month){
    const clientSites = state.sites.filter(s=>s.clientId===clientId);
    const siteIds = new Set(clientSites.map(s=>s.id));
    const entries = state.entries.filter(e=>e.date.startsWith(month) && siteIds.has(e.siteId));

    return clientSites.map(site=>{
      const siteEntries = entries.filter(e=>e.siteId===site.id);
      const jinko = siteEntries.reduce((a,e)=>a+Number(e.jinko||0),0);
      const expenses = siteEntries.reduce((a,e)=>a+Number(e.expense||0),0);
      const client = clientById(site.clientId);
      const rate = Number(site.billRate || client?.billRate || 0);
      const laborAmount = jinko * rate;
      return {
        site,
        jinko,
        rate,
        laborAmount,
        expenses,
        amount: laborAmount + expenses
      };
    }).filter(r=>r.jinko>0 || r.expenses>0);
  }

  function renderInvoice(){
    const clientId = $("invoiceClient").value;
    const month = $("invoiceMonth").value || monthLocal();
    const taxRate = Number($("invoiceTax").value||0);
    const number = $("invoiceNumber").value.trim();

    if(!clientId){
      $("invoicePreview").innerHTML = `<div class="card"><div class="empty">元請け会社を選んでな。</div></div>`;
      return;
    }

    const client = clientById(clientId);
    const rows = invoiceRowsFor(clientId, month);

    if(!rows.length){
      $("invoicePreview").innerHTML = `<div class="card"><div class="empty">この月の請求対象データがないで。</div></div>`;
      return;
    }

    const subtotal = rows.reduce((a,r)=>a+r.amount,0);
    const tax = Math.floor(subtotal * taxRate / 100);
    const total = subtotal + tax;
    const [y,m] = month.split("-");

    const trs = rows.map(r=>`
      <tr>
        <td>${escapeHtml(r.site.name)}</td>
        <td>${r.jinko.toFixed(2)}</td>
        <td>${yen(r.rate)}</td>
        <td>${yen(r.laborAmount)}</td>
        <td>${yen(r.expenses)}</td>
        <td>${yen(r.amount)}</td>
      </tr>
    `).join("");

    $("invoicePreview").innerHTML = `
      <div class="invoice-sheet">
        <div class="invoice-title">請 求 書</div>

        <div class="invoice-head">
          <div>
            <div style="font-size:20px;font-weight:800">${escapeHtml(client?.name||"")} 御中</div>
            <div class="muted" style="margin-top:6px">${escapeHtml(client?.address||"")}</div>
            <div style="margin-top:22px;font-size:14px">${y}年${Number(m)}月分</div>
          </div>
          <div class="invoice-right">
            <div>請求書番号：${escapeHtml(number||"-")}</div>
            <div style="margin-top:8px">発行日：${todayLocal()}</div>
            <div style="margin-top:18px;font-weight:800">株式会社REFISE</div>
          </div>
        </div>

        <div class="section-title">下記の通りご請求申し上げます。</div>
        <div class="invoice-total">ご請求金額　${yen(total)}（税込）</div>

        <table class="invoice-table">
          <thead>
            <tr>
              <th>現場</th>
              <th>人工</th>
              <th>単価</th>
              <th>人工金額</th>
              <th>経費</th>
              <th>金額</th>
            </tr>
          </thead>
          <tbody>${trs}</tbody>
        </table>

        <table class="invoice-table" style="margin-left:auto;width:360px;max-width:100%">
          <tbody>
            <tr><th>小計</th><td>${yen(subtotal)}</td></tr>
            <tr><th>消費税 ${taxRate}%</th><td>${yen(tax)}</td></tr>
            <tr><th>合計</th><td><strong>${yen(total)}</strong></td></tr>
          </tbody>
        </table>

        ${client?.payment ? `<div class="muted" style="margin-top:18px">支払条件：${escapeHtml(client.payment)}</div>` : ""}
      </div>
    `;
  }

  $("makeInvoiceBtn").addEventListener("click", renderInvoice);
  $("printInvoiceBtn").addEventListener("click", ()=>{
    renderInvoice();
    setTimeout(()=>window.print(), 50);
  });
  $("invoiceMonth").addEventListener("change", renderInvoice);
  $("invoiceClient").addEventListener("change", renderInvoice);
  $("invoiceTax").addEventListener("change", renderInvoice);

  function renderAll(){
    renderClients();
    renderWorkerCompanies();
    renderSelects();
    renderSites();
    renderWorkers();
    renderRecent();
    renderSummary();
    if($("invoiceClient")) renderInvoice();
  }

  renderAll();

  if(!hasStorage){
    setTimeout(()=>alert("この開き方ではSafariの保存機能が使えへんみたい。URLとして公開して開く必要があるで。"), 400);
  }
})();
</script>
</body>
</html>
